<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">TerraQuorum</title>
  <desc id="description">A cheerful globe assistant connects country research, data comparison and diplomatic simulation.</desc>
