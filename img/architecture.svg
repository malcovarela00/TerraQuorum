<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="680" rx="32" fill="#f8fafc"/>
  <text x="60" y="82" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">TerraQuorum architecture</text>
  <text x="60" y="122" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">Frontend, backend, data tools and AI providers working as one local-first stack.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="70" y="250" width="190" height="110" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="118" y="298" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">User</text>
  <text x="102" y="328" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="15">Researcher / analyst</text>

  <rect x="350" y="220" width="230" height="170" rx="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="410" y="272" fill="#134e4a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Frontend</text>
  <text x="394" y="306" fill="#115e59" font-family="Inter, Arial, sans-serif" font-size="16">React + Vite</text>
  <text x="394" y="332" fill="#115e59" font-family="Inter, Arial, sans-serif" font-size="16">TanStack Query</text>

  <rect x="700" y="220" width="230" height="170" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="762" y="272" fill="#4c1d95" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Backend</text>
  <text x="744" y="306" fill="#5b21b6" font-family="Inter, Arial, sans-serif" font-size="16">FastAPI + Beanie</text>
  <text x="744" y="332" fill="#5b21b6" font-family="Inter, Arial, sans-serif" font-size="16">Auth + OpenAPI</text>

  <rect x="980" y="110" width="170" height="110" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1018" y="160" fill="#7f1d1d" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">AI providers</text>
  <text x="1008" y="190" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="14">OpenAI / Anthropic</text>

  <rect x="980" y="285" width="170" height="110" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1018" y="335" fill="#0c4a6e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">MCP tools</text>
  <text x="1010" y="365" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="14">Country analysis</text>

  <rect x="980" y="460" width="170" height="110" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1014" y="510" fill="#14532d" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">MongoDB</text>
  <text x="1010" y="540" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="14">Countries + chats</text>

  <rect x="700" y="460" width="230" height="110" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="754" y="510" fill="#78350f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Mail / SMTP</text>
  <text x="744" y="540" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14">Mailcatcher locally</text>

  <line x1="260" y1="305" x2="350" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="305" x2="700" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="280" x2="980" y2="180" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="330" x2="980" y2="340" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="370" x2="980" y2="515" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="815" y1="390" x2="815" y2="460" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
